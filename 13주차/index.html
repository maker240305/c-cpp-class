<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPS 이동 경로</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
  <style>
    :root {
      color-scheme: light;
      --route: #174bdd;
      --start: #087c61;
      --end: #bd3b32;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f3f6fa;
      color: #18263c;
      font: 1rem/1.5 system-ui, sans-serif;
    }

    main {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 90rem;
      min-height: 100vh;
      min-height: 100dvh;
      margin: auto;
      padding: clamp(1rem, 3vw, 2.5rem);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      letter-spacing: -0.04em;
    }

    #status, #tile-status {
      margin: 0.25rem 0 0;
      color: #45566f;
    }

    #map {
      flex: 1;
      min-height: 20rem;
      border: 1px solid #c3cedc;
      border-radius: 0.85rem;
      background: #e4eaf2;
    }

    .map-tools, .legend {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem 1rem;
    }

    .map-tools { justify-content: space-between; }

    .legend {
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 0.9rem;
    }

    .legend li {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .route { --point-color: var(--route); }
    .start { --point-color: var(--start); }
    .end { --point-color: var(--end); }

    .legend li::before {
      content: "";
      width: 0.65rem;
      height: 0.65rem;
      border-radius: 50%;
      background: var(--point-color);
    }

    .legend .route::before {
      width: 1.25rem;
      height: 0.25rem;
      border-radius: 1rem;
    }

    .gps-marker {
      border: 2px solid white;
      border-radius: 50%;
      background: var(--point-color);
      box-shadow: 0 0 0 1px var(--point-color);
    }

    .gps-marker:focus-visible, button:focus-visible {
      outline: 3px solid #18263c;
      outline-offset: 3px;
    }

    .gps-route {
      filter: drop-shadow(0 0 1px white) drop-shadow(0 0 2px white);
    }

    button {
      padding: 0.55rem 0.9rem;
      border: 1px solid #c3cedc;
      border-radius: 0.55rem;
      background: white;
      color: inherit;
      font: inherit;
      font-size: 0.9rem;
      cursor: pointer;
    }

    button:hover:enabled { background: #e8eef7; }
    button:disabled { opacity: 0.55; cursor: default; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>GPS 이동 경로</h1>
      <p id="status" role="status">output.json을 불러오는 중입니다.</p>
      <p id="tile-status" role="status" hidden></p>
    </header>
    <div id="map" role="region" aria-label="GPS 위치와 이동 경로 지도"></div>
    <div class="map-tools">
      <ul class="legend" aria-label="지도 범례">
        <li class="route">이동 경로</li>
        <li class="start">출발</li>
        <li class="end">도착</li>
      </ul>
      <button id="fit-route" type="button" disabled>전체 경로 보기</button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
  <script>
    const statusText = document.getElementById("status");
    const tileStatus = document.getElementById("tile-status");
    const fitButton = document.getElementById("fit-route");

    function isValidPoint(point) {
      return point != null &&
        Number.isFinite(point.latitude) && Math.abs(point.latitude) <= 90 &&
        Number.isFinite(point.longitude) && Math.abs(point.longitude) <= 180;
    }

    function addPoint(map, point, index, total) {
      let label = `기록 ${index + 1}`;
      let colorClass = "route";

      if (total > 1 && index === 0) {
        label = "출발";
        colorClass = "start";
      } else if (total > 1 && index === total - 1) {
        label = "도착";
        colorClass = "end";
      }

      const icon = L.divIcon({
        className: `gps-marker ${colorClass}`,
        iconSize: colorClass === "route" ? [12, 12] : [18, 18]
      });

      // JSON의 문자열은 HTML이 아닌 텍스트로 표시합니다.
      const popup = document.createElement("div");
      const title = document.createElement("strong");
      title.textContent = label;
      popup.append(title, document.createElement("br"));
      popup.append(`위도 ${point.latitude} / 경도 ${point.longitude}`);
      if (typeof point.info === "string" && point.info.trim()) {
        popup.append(document.createElement("br"), point.info);
      }

      const marker = L.marker([point.latitude, point.longitude], { icon, title: label })
        .bindPopup(popup)
        .addTo(map);
      marker.getElement().setAttribute("aria-label", label);
    }

    async function drawRoute() {
      if (location.protocol === "file:") {
        throw new Error("로컬 서버를 실행한 뒤 http://localhost:8000에서 열어 주세요.");
      }
      if (!window.L) {
        throw new Error("Leaflet을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.");
      }

      const response = await fetch("./output.json", { cache: "no-cache" });
      if (!response.ok) {
        throw new Error(`output.json을 불러오지 못했습니다 (HTTP ${response.status}).`);
      }

      const points = await response.json();
      if (!Array.isArray(points) || points.length === 0) {
        throw new Error("output.json에 GPS 기록이 없습니다.");
      }
      const invalidIndex = points.findIndex(point => !isValidPoint(point));
      if (invalidIndex !== -1) {
        throw new Error(`output.json의 ${invalidIndex + 1}번째 기록에 올바른 위도·경도가 필요합니다.`);
      }

      const map = L.map("map");
      const coordinates = points.map(point => [point.latitude, point.longitude]);
      const bounds = L.latLngBounds(coordinates);
      const fitRoute = () => map.fitBounds(bounds, { padding: [32, 32], maxZoom: 17 });
      fitRoute();

      const tiles = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      });
      tiles.on("loading", () => { tileStatus.hidden = true; });
      tiles.on("tileerror", () => {
        tileStatus.textContent = "지도 배경을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.";
        tileStatus.hidden = false;
      });
      tiles.addTo(map);

      // GPS 기록 순서대로 좌표를 이어 이동 경로를 그립니다.
      if (coordinates.length > 1) {
        L.polyline(coordinates, {
          color: "#174bdd",
          weight: 5,
          opacity: 0.95,
          smoothFactor: 0,
          interactive: false,
          className: "gps-route"
        }).addTo(map);
      }
      points.forEach((point, index) => addPoint(map, point, index, points.length));

      fitButton.addEventListener("click", fitRoute);
      fitButton.disabled = false;
      statusText.textContent = `GPS 기록 ${points.length}개 · 점을 누르면 좌표와 기록 정보를 볼 수 있습니다.`;
    }

    drawRoute().catch(error => {
      statusText.textContent = error instanceof SyntaxError
        ? "output.json의 JSON 형식을 확인해 주세요."
        : error.message;
    });
  </script>
</body>
</html>
